[package]
name = "libsufr"
version = "0.8.0"
rust-version = "1.88"
edition = "2021"
description = "Parallel Construction of Suffix Arrays in Rust"
license = "BSD-3-Clause"
repository = "https://github.com/TravisWheelerLab/sufr"
authors = [
    "Ken Youens-Clark <kyclark@arizona.edu>",
    "Jack Roddy <jroddy@pharmacy.arizona.edu>",
    "Travis Wheeler <twheeler@arizona.edu>"
]

[features]
# The generic suffix array and its storage types, for a caller that
# names them to skip the box in SuffixArray.
typed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = "1.0.86"
bincode = "1.3.3"
home = "0.5.9"
log = "0.4.22"
needletail = "0.7.3"
rayon = "1.10.0"
thread_local = "1.1.8"

[dev-dependencies]
assert_cmd = "2.0.16"
pretty_assertions = "1.4.0"
tempfile = "3.12.0"
